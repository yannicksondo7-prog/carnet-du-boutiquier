
name: Generer APK Carnet du Boutiquier

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances
        run: npm install

      - name: Construire le site
        run: npm run build

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

    
      - name: Preparer Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>Chargement de Carnet du Boutiquier...</body></html>' > dist/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.williamdigitallabs.carnetboutiquier",
            "appName": "Carnet du Boutiquier",
            "webDir": "dist",
            "server": {
              "url": "https://carnet-du-boutiquier.lovable.app",
              "cleartext": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android    
          - name: Corriger les dependances Kotlin
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' &&
                          (details.requested.name == 'kotlin-stdlib-jdk7' ||
                           details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF
      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --exclude-task lint

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: carnet-du-boutiquier-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
