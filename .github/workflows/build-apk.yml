name: Generer APK Carnet du Boutiquier

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparer Capacitor
        run: |
          mkdir -p /tmp/apk && cd /tmp/apk
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>Chargement de Carnet du Boutiquier...</body></html>' > dist/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.williamdigitallabs.carnetboutiquier",
            "appName": "Carnet du Boutiquier",
            "webDir": "dist",
            "server": {
              "url": "https://carnet-du-boutiquier.lovable.app",
              "cleartext": false
            }
          }
          EOF
          npx cap add android

      - name: Compiler APK
        run: |
          cd /tmp/apk/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/carnet-du-boutiquier.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Carnet du Boutiquier Android ${{ github.run_number }}
          make_latest: true
          files: carnet-du-boutiquier.apk
